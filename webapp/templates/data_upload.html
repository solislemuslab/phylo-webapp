{% extends "base.html" %}
{% block title %}Data Upload{% endblock %}

{% block content %}
<h1>Upload data</h1>
{% with messages = get_flashed_messages() %}
    {% if messages %}
        {% for msg in messages %}
            <p>{{msg}}</p>
        {% endfor %}
    {% endif %}
{% endwith %}

<form method="POST" enctype="multipart/form-data">
    <input type="file" name="file">
    <input type="submit" value="Upload">
</form>



{% endblock %}
